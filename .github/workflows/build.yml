name: Собрать приложение

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac-arm
            files: dist/*.dmg
            name: macOS-AppleSilicon
          - os: macos-latest
            script: dist:mac-intel
            files: dist/*.dmg
            name: macOS-Intel
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Запутать код
        run: npm run obfuscate
      - name: Проверить запутанный код
        run: |
          npm test
          node --check renderer/renderer.js
          node --check renderer/mini.js
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Playhead-${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: out/**/*
