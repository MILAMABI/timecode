<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Таймкод — виджет</title>
<style>
/* Мини-виджет: тёмное «жидкое стекло» с крупными скруглениями и этапами-пилюлями. */
:root{
  --fg:#f5f5f7; --muted:#a1a1a6; --rec:#ff453a; --ok:#30d158;
  --c1:#0a84ff; --c2:#ff9f0a; --c3:#30d158; --c4:#bf5af2; --c5:#ff375f; --c6:#64d2ff; --c7:#5e5ce6; --c8:#98989d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;height:100%;font:12px/1.3 var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
body{display:flex;align-items:flex-start;justify-content:flex-start}
body.right{justify-content:flex-end}
.w{position:relative;margin:8px;border-radius:24px;flex:none;width:calc(100vw - 16px);overflow:hidden;padding:10px 10px 11px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(180deg,rgba(44,44,50,.86),rgba(24,24,28,.86));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 5px rgba(0,0,0,.3)}
.w::before,.chip::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(165deg,rgba(255,255,255,.45),rgba(255,255,255,.05) 40%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.28));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.top{display:flex;align-items:center;gap:9px;-webkit-app-region:drag;min-width:0;padding:0 2px 0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:#48484a;flex:none}
.on .dot{background:var(--rec);box-shadow:0 0 10px var(--rec);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tc{font:300 19px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.off .tc{color:var(--muted)}
.what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:500}
.on .what{color:var(--fg)}
.ic{-webkit-app-region:no-drag;background:rgba(255,255,255,.08);border:0;color:var(--muted);width:24px;height:24px;border-radius:50%;cursor:default;font-size:12px;line-height:1;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ic:hover{background:rgba(255,255,255,.16);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;-webkit-app-region:no-drag}
.chip{--c:var(--c1);position:relative;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:5px 12px 5px 6px;cursor:default;white-space:nowrap;
  font:600 11.5px var(--font);color:color-mix(in srgb,var(--c) 60%,white);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,transparent),color-mix(in srgb,var(--c) 7%,transparent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.chip::before{background:linear-gradient(165deg,color-mix(in srgb,var(--c) 85%,white),color-mix(in srgb,var(--c) 15%,transparent) 45%,color-mix(in srgb,var(--c) 15%,transparent) 60%,color-mix(in srgb,var(--c) 65%,white));opacity:.45}
.chip i{width:16px;height:16px;border-radius:50%;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,white),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chip:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 12%,transparent))}
.chip.cur{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 18%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.chip.cur::before{opacity:1}
.chip.ovr i{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.chip.auto{--c:#8e8e93}
.chip.auto.cur{--c:var(--ok)}
.chip.stop{--c:var(--rec)}
.chip.resume{--c:var(--ok)}
.paused .dot{background:var(--c2);box-shadow:0 0 10px var(--c2)}
.paused .tc{color:var(--c2)}
.paused .what{color:var(--fg)}
.ic svg{width:10px;height:10px;fill:currentColor;display:block;margin:auto}
#pauseMini{color:var(--fg)}
.paused #pauseMini{background:color-mix(in srgb,var(--ok) 70%,transparent);color:#fff}
:focus-visible{outline:2px solid rgba(10,132,255,.7);outline-offset:1px}
/* ---- свёрнутый виджет: стеклянный кружок с точкой ---- */
.top,.chips{transition:opacity .22s cubic-bezier(.4,0,.2,1)}
.w.fading .top,.w.fading .chips{opacity:0}
.orb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:50%;cursor:default;-webkit-app-region:no-drag}
.w.collapsed,.w.morphing{padding:0}
.w.collapsed .top,.w.collapsed .chips{display:none}
.w.collapsed .orb,.w.morphing .orb{display:flex}
.w.morphing .top,.w.morphing .chips{position:absolute;left:10px;right:10px;opacity:0;pointer-events:none}
.w.morphing .top{top:10px}
.w.morphing .chips{top:44px}
.w.collapsed{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.3)}
.core{--k:#636366;width:12px;height:12px;border-radius:50%;background:var(--k);transition:background .3s,box-shadow .3s,transform .3s,opacity .3s}
.w.morphing .core{opacity:var(--core-o,1)}
.w.on .core{--k:var(--rec);box-shadow:0 0 0 3px color-mix(in srgb,var(--rec) 22%,transparent),0 0 14px var(--rec);animation:blink 1.1s ease-in-out infinite}
.w.paused .core{--k:var(--c2);box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 22%,transparent),0 0 12px var(--c2);animation:breathe 2.6s ease-in-out infinite}
.w.morphing .core{animation:none}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.82)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
.orb:hover .core{transform:scale(1.15)}
.orb:focus-visible{outline:2px solid rgba(10,132,255,.7);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){.w.on .core,.w.paused .core{animation:none}}

@media (prefers-reduced-motion:reduce){.on .dot{animation:none}}
</style>
</head>
<body>
<div class="w off" id="w">
  <div class="top">
    <span class="dot" aria-hidden="true"></span>
    <span class="tc" id="tc">0:00:00</span>
    <span class="what" id="what">Загрузка…</span>
    <button class="ic" id="pauseMini" title="Пауза" aria-label="Пауза"></button>
    <button class="ic" id="openMain" title="Открыть трекер" aria-label="Открыть трекер">⤢</button>
    <button class="ic" id="collapseMini" title="Свернуть в точку" aria-label="Свернуть в точку"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="2.6"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="orb" id="orb" role="button" tabindex="0" aria-label="Развернуть виджет"><span class="core"></span></div>
</div>
<script src="mini.js"></script>
</body>
</html>
