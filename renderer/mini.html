<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Таймкод — виджет</title>
<style>
/* Мини-виджет в стиле HUD-панелей macOS: тёмное стекло, системный шрифт, этапы — цветными точками. */
:root{
  --panel:rgba(30,30,32,.9); --line:rgba(255,255,255,.1); --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.16);
  --fg:#f5f5f7; --muted:#98989d; --rec:#ff453a; --ok:#30d158;
  --c1:#0a84ff; --c2:#ff9f0a; --c3:#30d158; --c4:#bf5af2; --c5:#ff375f; --c6:#64d2ff; --c7:#5e5ce6; --c8:#98989d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;font:12px/1.3 var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.w{margin:6px;background:var(--panel);border:.5px solid var(--line);border-radius:14px;padding:9px 9px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
body.vib .w{margin:0;background:transparent;border:0;border-radius:0;box-shadow:none}
.top{display:flex;align-items:center;gap:8px;-webkit-app-region:drag;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:#48484a;flex:none}
.on .dot{background:var(--rec);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tc{font:300 18px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.off .tc{color:var(--muted)}
.what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:500}
.on .what{color:var(--fg)}
.ic{-webkit-app-region:no-drag;background:none;border:0;color:var(--muted);width:20px;height:20px;border-radius:50%;cursor:default;font-size:13px;line-height:1;flex:none}
.ic:hover{background:var(--fill-2);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:4px;-webkit-app-region:no-drag}
.chip{--c:var(--c1);display:inline-flex;align-items:center;gap:6px;background:var(--fill);border:0;border-radius:7px;padding:4px 8px;color:var(--fg);font:500 11.5px var(--font);cursor:default;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.chip:hover{background:var(--fill-2)}
.chip.cur{background:color-mix(in srgb,var(--c) 32%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent)}
.chip.ovr::after{content:"•";color:var(--c);margin-left:-2px}
.chip kbd{font:10px var(--font);color:var(--muted)}
.chip.auto{--c:var(--muted)}
.chip.auto.cur{--c:var(--ok)}
.chip.stop{--c:var(--rec)}
:focus-visible{outline:2px solid rgba(10,132,255,.7);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.on .dot{animation:none}}
</style>
</head>
<body>
<div class="w off" id="w">
  <div class="top">
    <span class="dot" aria-hidden="true"></span>
    <span class="tc" id="tc">0:00:00</span>
    <span class="what" id="what">Загрузка…</span>
    <button class="ic" id="openMain" title="Открыть трекер" aria-label="Открыть трекер">⤢</button>
    <button class="ic" id="hideMini" title="Скрыть виджет" aria-label="Скрыть виджет">×</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<script src="mini.js"></script>
</body>
</html>
